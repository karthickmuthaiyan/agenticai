<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Home</title>
	<style>
		:root {
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: #f8fafc;
			background: #0f172a;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 2rem;
			background:
				radial-gradient(circle at 15% 20%, rgba(56, 189, 248, .22), transparent 30%),
				radial-gradient(circle at 85% 80%, rgba(129, 140, 248, .24), transparent 32%),
				#0f172a;
		}

		main {
			width: min(100%, 680px);
			padding: clamp(3rem, 10vw, 6rem) clamp(2rem, 8vw, 5rem);
			text-align: center;
			border: 1px solid rgba(255, 255, 255, .14);
			border-radius: 28px;
			background: rgba(15, 23, 42, .62);
			box-shadow: 0 24px 80px rgba(0, 0, 0, .35), inset 0 1px rgba(255, 255, 255, .1);
			backdrop-filter: blur(18px);
		}

		h1 {
			margin: 0 0 1rem;
			font-size: clamp(2.75rem, 8vw, 5rem);
			line-height: 1;
			letter-spacing: -.06em;
			background: linear-gradient(135deg, #f8fafc, #7dd3fc 55%, #a5b4fc);
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
		}

		p { margin: 0 0 2rem; color: #cbd5e1; font-size: 1.1rem; }

		a { text-decoration: none; }

		button {
			padding: .85rem 1.5rem;
			border: 0;
			border-radius: 999px;
			color: #082f49;
			background: linear-gradient(135deg, #67e8f9, #a5b4fc);
			font: inherit;
			font-weight: 700;
			cursor: pointer;
			box-shadow: 0 8px 24px rgba(103, 232, 249, .22);
			transition: transform .2s ease, box-shadow .2s ease;
		}

		button:hover, button:focus-visible {
			transform: translateY(-3px);
			box-shadow: 0 12px 30px rgba(103, 232, 249, .35);
		}
	</style>
</head>
<body>
	<main>
		<h1>Welcome</h1>
		<p>A beautiful space to begin something remarkable.</p>
		<a href="/about"><button type="button">About</button></a>
	</main>
</body>
</html>
